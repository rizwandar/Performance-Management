<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leaf Reveal — In Good Hands</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,400;0,700&display=swap">
<style>
  :root{
    --hero-bg:#14301F;
    --hero-ink:#F1EAD9;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    min-height:100vh;
    background-color:var(--hero-bg);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:Georgia, 'Times New Roman', serif;
  }

  .stage{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    padding:80px 20px 60px;
  }

  .mark{
    width:90px;
    height:90px;
    margin-bottom:1rem;
    opacity:0;
    transform:scale(0.82) rotate(-6deg);
    animation:unfurl 2.9s cubic-bezier(.22,.9,.32,1) forwards;
    animation-delay:0.4s;
  }

  .mark svg{ width:100%; height:100%; display:block; }

  .wordmark{
    margin:0 0 0.75rem;
    font-family:Georgia, 'Times New Roman', serif;
    font-style:italic;
    font-size:2.6rem;
    font-weight:800;
    color:var(--hero-ink);
    opacity:0;
    transform:translateY(10px);
    animation:rise 1.9s cubic-bezier(.22,.9,.32,1) forwards;
    animation-delay:3.5s;
  }

  .vision{
    max-width:560px;
    margin:0 auto;
    font-family:'Merriweather', Georgia, serif;
    font-size:1.25rem;
    line-height:1.6;
    color:var(--hero-ink);
    opacity:0;
    transform:translateY(14px);
    animation:rise 2.2s cubic-bezier(.22,.9,.32,1) forwards;
    animation-delay:9.4s;
  }

  .vision em{
    font-style:italic;
  }

  @keyframes unfurl{
    to{ opacity:1; transform:scale(1) rotate(0deg); }
  }
  @keyframes rise{
    to{ opacity:1; transform:translateY(0); }
  }

  @media (prefers-reduced-motion: reduce){
    .mark, .wordmark, .vision{ animation:none; opacity:1; transform:none; }
  }

  .picker{
    position:fixed;
    left:50%;
    bottom:22px;
    transform:translateX(-50%);
    display:flex;
    align-items:center;
    gap:10px;
    background:rgba(20,48,31,0.55);
    border:1px solid rgba(241,234,217,0.35);
    border-radius:999px;
    padding:8px 16px;
    backdrop-filter:blur(4px);
    opacity:0;
    pointer-events:none;
    transition:opacity 0.5s ease;
  }
  .picker.is-visible{
    opacity:1;
    pointer-events:auto;
  }
  .picker label{
    font-size:0.8rem;
    color:var(--hero-ink);
    opacity:0.85;
  }
  .picker select{
    font-family:'Merriweather', Georgia, serif;
    font-size:0.85rem;
    color:#14301F;
    background:var(--hero-ink);
    border:none;
    border-radius:999px;
    padding:5px 12px;
    cursor:pointer;
  }

  .replay{
    position:fixed;
    right:22px;
    bottom:22px;
    font-family:'Merriweather', Georgia, serif;
    font-size:0.8rem;
    color:var(--hero-ink);
    background:rgba(20,48,31,0.55);
    border:1px solid rgba(241,234,217,0.35);
    border-radius:999px;
    padding:8px 16px;
    cursor:pointer;
  }
  .replay:hover{ background:rgba(20,48,31,0.8); }
</style>
</head>
<body>

<div class="stage">
  <div class="mark" role="img" aria-label="In Good Hands leaf mark">
    <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <line x1="100" y1="184" x2="100" y2="156" stroke="#7CB342" stroke-width="5" stroke-linecap="round"/>
      <path d="M100 156 C60 156 34 118 34 78 C34 78 70 62 100 30 Z" fill="#7CB342"/>
      <path d="M100 156 C140 156 166 118 166 78 C166 78 130 62 100 30 Z" fill="#AED581"/>
      <path d="M100 148 C100 148 100 90 100 34" stroke="#33691E" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8"/>
      <circle cx="112" cy="52" r="7" fill="#fff" opacity="0.85"/>
      <circle cx="112" cy="52" r="7" fill="none" stroke="#33691E" stroke-width="1" opacity="0.3"/>
    </svg>
  </div>

  <p class="wordmark">In Good Hands</p>

  <p class="vision">A gentle, private space to gather everything your loved ones will need, so that when the time comes, they are <em>truly in good hands</em>.</p>
</div>

<div class="picker">
  <label for="leafPicker">Leaf shape (Lime Green)</label>
  <select id="leafPicker">
    <option value="single-leaf">Single Leaf</option>
    <option value="herb-sprig">Herb Sprig</option>
    <option value="rounded-leaf">Rounded Leaf</option>
    <option value="line-leaf">Line Leaf</option>
    <option value="two-leaf-sprig">Two-Leaf Sprig</option>
    <option value="heart-leaf">Heart Leaf</option>
    <option value="trefoil">Trefoil</option>
    <option value="willow-blade">Willow Blade</option>
    <option value="maple-leaf">Maple Leaf</option>
    <option value="fern-frond">Fern Frond</option>
    <option value="bay-sprig">Bay Sprig</option>
    <option value="dew-drop-leaf" selected>Dew-Drop Leaf</option>
    <option value="curled-leaf">Curled Leaf</option>
    <option value="ivy-leaf">Ivy Leaf</option>
    <option value="eucalyptus-blade">Eucalyptus Blade</option>
    <option value="split-leaf">Split Leaf</option>
    <option value="serrated-leaf">Serrated Leaf</option>
    <option value="palm-frond">Palm Frond</option>
    <option value="faceted-leaf">Faceted Leaf</option>
    <option value="mirror-leaf">Mirror Leaf</option>
  </select>
</div>

<button class="replay" type="button" onclick="location.reload()">Replay ↻</button>

<script>

      <g fill="#AED581">

      <ellipse rx="16" ry="6.5" transform="translate(74,132) rotate(-28)"/>

    `,

    `,
    'faceted-leaf': `
      <polygon points="100,30 138,66 152,110 122,158 100,178 78,158 48,110 62,66" fill="#AED581"/>
      <polyline points="100,30 100,178" stroke="#33691E" stroke-width="2.5" opacity="0.5"/>
      <polyline points="100,66 62,66" stroke="#33691E" stroke-width="1.5" opacity="0.3"/>
      <polyline points="100,66 138,66" stroke="#33691E" stroke-width="1.5" opacity="0.3"/>
    `,
    'mirror-leaf': `
      <path d="M100 100 C100 100 62 90 56 52 C86 44 106 70 100 100 Z" fill="#7CB342"/>
      <path d="M100 100 C100 100 138 110 144 148 C114 156 94 130 100 100 Z" fill="#AED581"/>

    `,

  document.getElementById('leafPicker').addEventListener('change', (e) => {
    document.querySelector('.mark svg').innerHTML = MARKS[e.target.value]
  })

  // The picker stays hidden through the reveal so it doesn't distract from
  // the leaf / wordmark / vision sequence (and doesn't show up on a screen
  // recording of the intro). It appears on its own 20s after the vision
  // statement finishes animating in, or immediately if the mouse moves down
  // near the bottom of the page, whichever happens first. Once shown it
  // stays shown, no re-hiding, so it doesn't vanish while being used.
  const picker = document.querySelector('.picker')
  let revealed = false
  function revealPicker(){
    if (revealed) return
    revealed = true
    picker.classList.add('is-visible')
  }
  const visionDelay = 9.4, visionDuration = 2.2, holdAfter = 20
  setTimeout(revealPicker, (visionDelay + visionDuration + holdAfter) * 1000)
  window.addEventListener('mousemove', (e) => {
    if (window.innerHeight - e.clientY < 140) revealPicker()
  })
</script>

</body>
</html>
