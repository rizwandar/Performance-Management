<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Left arm: wider spread, starts lower, more prominent -->
  <path d="M18 174 C6 156 4 132 12 110 C20 88 38 78 48 88 L48 124 C48 136 56 146 68 152 L100 160"
        fill="none" stroke="#2D5A3D" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right arm: mirror -->
  <path d="M182 174 C194 156 196 132 188 110 C180 88 162 78 152 88 L152 124 C152 136 144 146 132 152 L100 160"
        fill="none" stroke="#2D5A3D" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Palm base: wider, lower curve giving a cradling look -->
  <path d="M48 124 Q100 168 152 124"
        fill="none" stroke="#2D5A3D" stroke-width="16" stroke-linecap="round"/>
  <!-- Heart shadow / depth -->
  <path d="M100 78
           C100 78 84 60 68 68
           C52 76 52 98 68 112
           L100 142
           L132 112
           C148 98 148 76 132 68
           C116 60 100 78 100 78 Z"
        fill="#A06830" opacity="0.25" transform="translate(2, 3)"/>
  <!-- Heart fill -->
  <path d="M100 78
           C100 78 84 60 68 68
           C52 76 52 98 68 112
           L100 142
           L132 112
           C148 98 148 76 132 68
           C116 60 100 78 100 78 Z"
        fill="#C9904A"/>
  <!-- Heart outline for crispness at small sizes -->
  <path d="M100 78
           C100 78 84 60 68 68
           C52 76 52 98 68 112
           L100 142
           L132 112
           C148 98 148 76 132 68
           C116 60 100 78 100 78 Z"
        fill="none" stroke="#9A6020" stroke-width="2.5"/>
  <!-- Highlight on heart -->
  <circle cx="82" cy="78" r="8" fill="white" opacity="0.28"/>
</svg>
