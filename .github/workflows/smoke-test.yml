name: Smoke Test

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  client-checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        run: npm install
        working-directory: client

      - name: Lint
        run: npm run lint
        working-directory: client

      - name: Build
        run: npm run build
        working-directory: client

  smoke-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        run: npm install
        working-directory: server

      - name: Start server and run smoke tests
        env:
          JWT_SECRET: ci-test-secret-not-for-production
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci_test
          NODE_ENV: test
          PORT: 3001
        run: |
          node index.js &
          SERVER_PID=$!

          # Wait up to 20 seconds for server to boot
          echo "Waiting for server to start..."
          for i in $(seq 1 20); do
            if curl -sf http://localhost:3001/api/health > /dev/null 2>&1; then
              echo "Server is up after ${i}s"
              break
            fi
            sleep 1
          done

          # Test 1: health endpoint returns ok
          echo ""
          echo "--- Test 1: /api/health ---"
          HEALTH=$(curl -sf http://localhost:3001/api/health)
          echo "$HEALTH"
          echo "$HEALTH" | grep -q '"status":"ok"' || { echo "FAIL: health check"; kill $SERVER_PID; exit 1; }
          echo "PASS"

          # Test 2: login with missing body returns 400, not 500
          echo ""
          echo "--- Test 2: /api/auth/login (bad request) ---"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:3001/api/auth/login \
            -H "Content-Type: application/json" -d '{}')
          echo "HTTP $STATUS"
          [ "$STATUS" = "400" ] || [ "$STATUS" = "401" ] || { echo "FAIL: expected 400/401, got $STATUS"; kill $SERVER_PID; exit 1; }
          echo "PASS"

          # Test 3: protected route without token returns 401
          echo ""
          echo "--- Test 3: /api/users/me (no token) ---"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/api/users/me)
          echo "HTTP $STATUS"
          [ "$STATUS" = "401" ] || { echo "FAIL: expected 401, got $STATUS"; kill $SERVER_PID; exit 1; }
          echo "PASS"

          kill $SERVER_PID
          echo ""
          echo "All smoke tests passed."
        working-directory: server

  # Guards the one file nothing else validates: server/package-lock.json.
  #
  # server/ is an npm workspace, so Dependabot writes its lockfile updates to
  # the ROOT package-lock.json and leaves server/package-lock.json stale. Render
  # builds the API with rootDir: server and runs `npm ci` there, and `npm ci`
  # refuses to run at all when a package.json and its lockfile disagree. On
  # 2026-10-06 that combination broke production API deploys while every check
  # in this workflow stayed green, because the jobs above install from the root,
  # which is always self-consistent.
  #
  # The copy to an empty directory outside the repo is the load-bearing part.
  # Running npm inside server/ resolves against the workspace root, reports
  # "up to date" and validates nothing at all.
  server-lockfile:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install exactly as Render does, isolated from the workspace
        run: |
          set -euo pipefail
          ISOLATED="$(mktemp -d)"
          cp server/package.json server/package-lock.json "$ISOLATED/"
          cd "$ISOLATED"
          echo "Running npm ci against server/package-lock.json, outside the workspace."
          if ! npm ci --ignore-scripts --no-audit --no-fund; then
            echo ""
            echo "server/package-lock.json is out of sync with server/package.json."
            echo ""
            echo "Render builds the API from server/ and runs npm ci, so this would"
            echo "fail the next production deploy."
            echo ""
            echo "To fix: copy server/package.json alone into an empty directory"
            echo "OUTSIDE this repo, run 'npm install --package-lock-only' there,"
            echo "and copy the resulting package-lock.json back to server/."
            echo "Running npm inside server/ will not work: it defers to the"
            echo "workspace root and silently changes nothing."
            exit 1
          fi
          echo "server/package-lock.json is consistent and installable."
