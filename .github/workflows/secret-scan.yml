name: Secret Scan

# TruffleHog OSS: free, open-source, no account/license required (unlike
# GitGuardian or the gitleaks marketplace action, which gate features behind
# a license for org-owned repos). Verifies matches live against the provider
# where possible, which keeps false positives low.
on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          # On a PR, scan only the diff introduced by the PR. On a direct
          # push (e.g. a merge to main/staging), scan the two commits the
          # push moved between - fetch-depth 0 above gives us full history
          # to diff against either way.
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event.after }}
          extra_args: --results=verified,unknown
