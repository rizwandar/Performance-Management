version: 2
updates:
  # One entry per npm workspace - Dependabot doesn't understand npm
  # workspaces natively, it needs each package.json pointed at directly.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    # Mobile is dropped from active development (2026-08-26) and, since
    # 2026-09-25, is no longer an npm workspace at all: it was removed from
    # the root workspaces array after a react version it pinned was hoisted
    # over the client's own and blanked production for several hours.
    #
    # The original reason for this ignore list was that workspace hoisting
    # pulled mobile's dependencies into the root lockfile. That is no longer
    # true. The list is kept because it is harmless and still expresses the
    # intent (do not open PRs for a deprecated target), but it is no longer
    # load-bearing. Remove it if mobile work ever resumes.
    ignore:
      - dependency-name: "react-native*"
      - dependency-name: "expo*"
      - dependency-name: "@expo/*"

  - package-ecosystem: "npm"
    directory: "/client"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    # react and react-dom must move together. React refuses to initialise
    # against a mismatched react-dom (error #527), and on 2026-09-25 a
    # Dependabot PR that bumped react alone blanked production for about
    # eight hours. Lint and build both passed; the mismatch only throws at
    # runtime in a browser.
    #
    # Two groups, deliberately. A groups entry defaults to
    # applies-to: version-updates, so grouping the routine bumps leaves
    # SECURITY updates ungrouped, and a GHSA affecting react alone would
    # still open a react-only PR: the same split, by the one route the
    # obvious config does not cover. Security updates are enabled on this
    # repository, so that path is live rather than hypothetical.
    #
    # Caveat worth keeping: a group PR only contains the members that have
    # a pending release, so a react-only release still yields a react-only
    # bump. The pair ships in lockstep in practice, but check react-dom
    # before merging either way.
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
      react-security:
        applies-to: "security-updates"
        patterns:
          - "react"
          - "react-dom"

  - package-ecosystem: "npm"
    directory: "/server"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies"]

  - package-ecosystem: "npm"
    directory: "/shared"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "ci"]
